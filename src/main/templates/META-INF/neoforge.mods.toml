modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/RemagOfficial/Rustic-Reforged/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "rustic_reforged_logo.png"
displayURL = "https://github.com/RemagOfficial/Rustic-Reforged"
authors = "cadaverous-eris, RemagOfficial"
description = '''A medieval themed Minecraft mod based around decoration, exploration, agriculture, and alchemy. Ported to NeoForge 1.21.1.'''

[[dependencies.${ mod_id }]]
modId = "neoforge"
type = "required"
versionRange = "[${ neo_version },)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
type = "required"
versionRange = "${ minecraft_version_range }"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "jei"
type = "optional"
versionRange = "[${ jei_version_range },)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${ mod_id }]]
modId = "crafttweaker"
type = "optional"
versionRange = "[${ crafttweaker_version_range },)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "dynamictrees"
type = "optional"
versionRange = "[${ dynamic_trees_version_range },)"
ordering = "AFTER"
side = "BOTH"
