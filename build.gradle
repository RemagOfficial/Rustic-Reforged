plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')
    // S10.3: Dynamic Trees writes the rustic tree-pack block assets into its own generated dir so the two datagen
    // passes do not share a HashCache (NeoForge datagen deletes any output file the current run does not re-claim,
    // so a single shared dir would have each pass wipe the other's files).
    srcDir('src/generated-dt/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("**/.gitkeep") // keeps the empty generated-resources dir tracked in git, not in the jar
    // Datagen writes a HashCache folder (.cache) at the ROOT of each generated output dir. Gradle exclude patterns
    // are relative to each srcDir, so ".cache/**" strips it from BOTH src/generated and src/generated-dt. (The old
    // "src/generated/**/.cache" form never matched anything - it was only tolerated while a single generated dir had
    // no sibling to collide with; two roots carrying an identically-named cache blob then fail processResources as a
    // duplicate entry.)
    exclude(".cache/**")

    // 1.12.2 metadata that has no meaning on NeoForge 1.21.1: mcmod.info is replaced by
    // META-INF/neoforge.mods.toml, pack.mcmeta is generated with the correct pack_format,
    // and rustic_at.cfg is a ForgeGradle access transformer in the old SRG format.
    exclude("mcmod.info")
    exclude("pack.mcmeta")
    exclude("META-INF/rustic_at.cfg")
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    // JEI (optional compat mod) is published under the mezz.jei group on modmaven.
    maven {
        url = "https://modmaven.dev/"
    }
    // CraftTweaker (optional compat mod) is published under the com.blamejared.crafttweaker group here.
    maven {
        url = "https://maven.blamejared.com/"
    }
    // Dynamic Trees is distributed on CurseForge; cursemaven mirrors those files as a Maven repo.
    maven {
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    // Modrinth
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // Phase 10 / S10.3: Dynamic Trees tree-pack datagen (olive / ironwood branch, leaves, sapling, seed, fruit
        // blockstates, models and loot). Runs RusticDataGen.gatherData in DT-only mode (the marker system property makes
        // it register Dynamic Trees' providers and skip Rustic's own same-named ones, which would otherwise collide).
        // It outputs to its OWN dir (src/generated-dt/resources) so it does not share runData's HashCache - datagen
        // deletes files a run does not re-claim, so a shared dir would make the two passes wipe each other. Requires
        // Dynamic Trees on the runtime classpath (it is, via localRuntime) and runData run first (its primitive log /
        // leaves models, referenced as existing parents, live in src/generated/resources).
        dtTreeData {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated-dt/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            // The tree generators parent the dynamic leaves / branch models on Rustic's own primitive log / leaves
            // models, which the normal runData writes into src/generated/resources.
            programArguments.addAll '--existing', file('src/generated/resources/').getAbsolutePath()
            // Dynamic Trees' generators parent the generated sapling/branch models on files shipped inside its own jar
            // (e.g. dynamictrees:block/smartmodel/sapling). --existing-mod feeds that jar's assets to the ExistingFileHelper.
            programArguments.addAll '--existing-mod', 'dynamictrees'
            systemProperty 'rustic.dtTreeDatagen', 'true'
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Unit test support, required by the ported Phase 0 characterisation tests: without this the test
    // source set never sees NeoForge or Minecraft and every baseline test would have to be rewritten to
    // poke at nothing. Later phases use the same hook to register content inside a plain JVM.
    unitTest {
        enable()
        testedMod = mods.getByName(mod_id)
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // The ported baseline tests run on the JUnit 5 platform that ModDevGradle's unitTest support drives.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // JEI is an optional runtime dependency: the API is compile-time only, the full jar is on the
    // dev runtime classpath (localRuntime, not runtimeOnly) so runClient can browse recipes without
    // the mod publishing a hard dependency on JEI.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // CraftTweaker is likewise an optional compat dependency: API is compileOnly, the full jar is on the dev
    // runtime classpath (localRuntime) so runClient can load ZenScript without a published hard dependency.
    // One artifact carries both the API and the runtime for the neoforge build.
    compileOnly "com.blamejared.crafttweaker:CraftTweaker-neoforge-${minecraft_version}:${crafttweaker_version}"
    localRuntime "com.blamejared.crafttweaker:CraftTweaker-neoforge-${minecraft_version}:${crafttweaker_version}"

    // Dynamic Trees is an optional compat dependency (S10.3). Its tree-pack JSON is inert data unless DT is
    // installed, so - unlike CraftTweaker/JEI - no runtime presence guard is needed. The API is compileOnly for
    // the small registry-handler glue class; the full jar is localRuntime so runData (DT's blockstate/model/loot
    // datagen) and the dev client both see the mod. Coordinate is a cursemaven CurseForge file id (see gradle.properties).
    compileOnly "curse.maven:dynamictrees-${dynamic_trees_project_id}:${dynamic_trees_file_id}"
    localRuntime "curse.maven:dynamictrees-${dynamic_trees_project_id}:${dynamic_trees_file_id}"

    // CC: Tweaked (used to auto generate jo-codes)
    compileOnly "maven.modrinth:gu7yAYhd:1ewzHZYg"
    localRuntime "maven.modrinth:gu7yAYhd:1ewzHZYg"
}

// ---------------------------------------------------------------------------
// Porting in progress: the 1.12.2 sources are kept in src/main/java as the
// reference for each rewrite, but they import Minecraft/Forge classes that no
// longer exist, so they must not reach the compiler. The two lists below are the
// ledger: every line in them stays excluded until the whole port is finished and
// the legacy tree is deleted. A file that has already been ported keeps its line
// and gets a '# PORTED ...' note above it, naming the replacement - removing the
// line would put the 1.12.2 file back on the compiler's path and break the build.
// ---------------------------------------------------------------------------
def unportedSources = { String listFile ->
    def listFileHandle = file(listFile)
    if (!listFileHandle.exists()) {
        return []
    }
    return listFileHandle.readLines()
            .collect { it.trim() }
            .findAll { !it.isEmpty() && !it.startsWith('#') }
}

def legacyMain = unportedSources('porting/legacy-main-java.txt')
def legacyTest = unportedSources('porting/legacy-test-java.txt')

legacyMain.each { sourceSets.main.java.exclude(it) }
legacyTest.each { sourceSets.test.java.exclude(it) }

tasks.register('portingStatus') {
    group = 'rustic porting'
    description = 'Shows how many 1.12.2 reference files are still excluded from compilation.'
    def mainRemaining = legacyMain.size()
    def testRemaining = legacyTest.size()
    doLast {
        println "1.12.2 reference files still excluded: ${mainRemaining} main, ${testRemaining} test"
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            jei_version_range      : jei_version_range,
            crafttweaker_version_range: crafttweaker_version_range,
            dynamic_trees_version_range: dynamic_trees_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs.add('-Xlint:deprecation') // the port must flag any use of a legacy/duplicate API
}

test {
    useJUnitPlatform()
    // ModDevGradle points the test JVM at build/minecraft-junit as its game directory, so the config and
    // log files a booted-FML test writes stay out of the repo.

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
